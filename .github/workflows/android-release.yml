# Workflow 1: Automated Android Build
# Trigger: pushing a release tag (v1.0.0, v1.2.3-rc1, ...).
# Output:  a SIGNED release APK, uploaded as a build artifact and attached
#          to the GitHub Release for that tag.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64   - your release keystore, base64-encoded:
#                               `base64 -w0 release.keystore`
#   ANDROID_KEYSTORE_USER     - key alias
#   ANDROID_KEYSTORE_PASSWORD - keystore/key password
#
# Signing uses Godot's official env-var overrides
# (GODOT_ANDROID_KEYSTORE_RELEASE_*), so no credentials ever touch
# export_presets.cfg or the git history.

name: Android Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: GambleWithFriends

permissions:
  contents: write # attach the APK to the GitHub Release

jobs:
  build-android:
    name: Export signed APK
    runs-on: ubuntu-latest
    container:
      # Godot editor + export templates + Android SDK preinstalled.
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret - cannot sign a release build."
            exit 1
          fi

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Import project (generate .godot cache)
        run: godot --headless --path . --import || true

      - name: Export signed release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          godot --headless --path . --export-release "Android" "build/android/${EXPORT_NAME}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/android/*.apk
          generate_release_notes: true
