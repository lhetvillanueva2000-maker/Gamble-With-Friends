# Workflow 1: Automated Android Build
#
# Triggers:
#   - release tags (v1.0.0, ...) -> signed RELEASE APK attached to the
#     GitHub Release (requires the ANDROID_KEYSTORE_* secrets below)
#   - manual "Run workflow" (workflow_dispatch) on any branch -> if the
#     release secrets are missing, falls back to an ephemeral
#     DEBUG-signed APK so anyone can grab an installable build from the
#     run's artifacts without touching signing infrastructure.
#
# Required secrets for RELEASE signing (optional for debug builds):
#   ANDROID_KEYSTORE_BASE64   - release keystore, base64: `base64 -w0 release.keystore`
#   ANDROID_KEYSTORE_USER     - key alias
#   ANDROID_KEYSTORE_PASSWORD - keystore/key password
#
# Signing uses Godot's official env overrides
# (GODOT_ANDROID_KEYSTORE_{RELEASE,DEBUG}_*), so credentials never touch
# export_presets.cfg or git history.

name: Android Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  EXPORT_NAME: GambleWithFriends

permissions:
  contents: write # attach the APK to the GitHub Release on tag builds

jobs:
  build-android:
    name: Export APK
    runs-on: ubuntu-latest
    container:
      # Godot editor + export templates + Android SDK preinstalled.
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare keystore (release if secrets exist, else ephemeral debug)
        id: keys
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Using RELEASE keystore from secrets."
          else
            keytool -genkeypair -v -keystore /tmp/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_* secrets configured - producing a DEBUG-signed APK (installable for testing, not store-ready)."
          fi

      - name: Link export templates into the runner HOME
        # The image ships templates under /root, but Actions container jobs
        # run with HOME=/github/home — Godot looks there.
        run: |
          ls /root/.local/share/godot/export_templates/
          mkdir -p "$HOME/.local/share/godot/export_templates"
          ln -sfn /root/.local/share/godot/export_templates/4.3.stable \
            "$HOME/.local/share/godot/export_templates/4.3.stable"

      - name: Configure editor paths (Android SDK + Java SDK)
        # Godot 4.3 requires BOTH export/android/android_sdk_path and
        # export/android/java_sdk_path in editor settings.
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_PATH" ]; then
            for c in /root/sdk /usr/lib/android-sdk /opt/android-sdk; do
              [ -d "$c" ] && SDK_PATH="$c" && break
            done
          fi
          JAVA_PATH="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")}"
          echo "Android SDK: $SDK_PATH | Java SDK: $JAVA_PATH"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
              "$SDK_PATH" "$JAVA_PATH" > ~/.config/godot/$f
          done

      - name: Import project (generate .godot cache)
        run: godot --headless --path . --import || true

      - name: Export APK
        # The GODOT_ANDROID_KEYSTORE_RELEASE_* trio may only exist when all
        # three are real — a path with empty user/password is a config error.
        env:
          RELEASE_KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          if [ "${{ steps.keys.outputs.mode }}" = "release" ]; then
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/release.keystore
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$RELEASE_KEYSTORE_USER"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$RELEASE_KEYSTORE_PASSWORD"
            godot --headless --path . --export-release "Android" "build/android/${EXPORT_NAME}.apk"
          else
            export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore
            export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
            export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
            godot --headless --path . --export-debug "Android" "build/android/${EXPORT_NAME}-debug.apk"
          fi
          ls -lh build/android

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.keys.outputs.mode == 'release'
        with:
          files: build/android/*.apk
          generate_release_notes: true
